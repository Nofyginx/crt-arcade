<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Block Snake 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <div id="view"></div>

  <div class="hud">
    <div class="brand"><span class="c1">B</span><span class="c2">L</span><span class="c3">O</span><span class="c4">C</span><span class="c5">K</span> <span class="c6">S</span><span class="c7">N</span><span class="c1">A</span><span class="c2">K</span><span class="c4">E</span> <small>3D</small></div>
    <div class="stats">
      <div class="chip"><b>SCORE</b><i id="score">0</i></div>
      <div class="chip"><b>BEST</b><i id="best">0</i></div>
      <div class="chip"><b>LEVEL</b><i id="level">1</i></div>
    </div>
  </div>

  <div id="start-overlay" class="overlay"><div class="card">
    <h2>BLOCK SNAKE</h2><p>Eat the golden gems. Don't hit the walls or bite yourself.</p>
    <button class="btn" id="start-btn">PLAY</button>
  </div></div>
  <div id="over-overlay" class="overlay hidden"><div class="card">
    <h2>GAME OVER</h2><p id="over-text">Score: 0</p>
    <button class="btn" id="retry-btn">PLAY AGAIN</button>
  </div></div>
  <div id="pause-overlay" class="overlay hidden"><div class="card">
    <h2>PAUSED</h2><p>Press P or tap resume.</p>
    <button class="btn" id="resume-btn">RESUME</button>
  </div></div>

  <div class="hint">Arrow keys / WASD to move &middot; P to pause</div>
  <div class="dpad" id="dpad">
    <button class="up" data-dir="up" aria-label="Up">&uarr;</button>
    <button class="left" data-dir="left" aria-label="Left">&larr;</button>
    <button class="mid" data-action="pause" aria-label="Pause">II</button>
    <button class="down" data-dir="down" aria-label="Down">&darr;</button>
    <button class="right" data-dir="right" aria-label="Right">&rarr;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js?v=1"></script>
</body>
</html>
